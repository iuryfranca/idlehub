<!doctype html>
<html lang="pt-BR" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark light">
  <title>IdleHub · Política de privacidade</title>
  <meta name="description" content="Política de privacidade do IdleHub: o app não coleta, não envia e não guarda dados pessoais em servidor nenhum.">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
</head>
<body>
  <div id="root"></div>
  <!-- Sem JavaScript, a politica continua legivel: o texto em portugues fica aqui tambem. -->
  <noscript>
    <main style="max-width:760px;margin:0 auto;padding:48px 16px;font-family:system-ui;line-height:1.6">
      <h1>Política de privacidade do IdleHub</h1>
      <p>O IdleHub não coleta, não envia e não guarda dados pessoais em nenhum servidor. Não existe servidor do IdleHub,
        nem conta, cadastro, telemetria, análise de uso, anúncios ou atualização automática. Os dados (jogos, apelidos das
        contas, preferências e a sessão de cada conta) ficam só no seu computador. A única requisição feita pelo próprio
        app é o ícone (favicon) de cada jogo, pedido ao site do próprio jogo por HTTPS. Código aberto:
        https://github.com/iuryfranca/idlehub</p>
    </main>
  </noscript>
  <script type="module" src="/src/privacy-main.tsx"></script>
</body>
</html>
