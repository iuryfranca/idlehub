<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Icone do IdleHub: a marca do site (4 paineis em 2x2) numa "janela" escura.
       Duas diagonais com a faixa de luz Aurora (#7c4dff -> #eeb8ca): varias contas, uma janela. -->
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#eeb8ca"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1.05" r="0.75">
      <stop offset="0" stop-color="#7c4dff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#1c1b20"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1.5"/>
  <g>
    <rect x="44" y="44" width="76" height="76" rx="20" fill="url(#aurora)"/>
    <rect x="136" y="44" width="76" height="76" rx="20" fill="#48454e"/>
    <rect x="44" y="136" width="76" height="76" rx="20" fill="#48454e"/>
    <rect x="136" y="136" width="76" height="76" rx="20" fill="url(#aurora)"/>
  </g>
</svg>
