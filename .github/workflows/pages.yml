# Publica o site de apresentação (pasta webpage/) no GitHub Pages.
# Roda a cada push na main que mexe no site, ou manualmente (aba Actions → Run workflow).
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['webpage/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webpage
      - id: deploy
        uses: actions/deploy-pages@v4
